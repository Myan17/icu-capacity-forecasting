AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Hospital ICU Capacity Forecasting – Serverless MVP
  Compute: Lambda | Storage: DynamoDB on-demand + S3 | Scheduler: EventBridge
  IaC: AWS SAM | Observability: Lambda Powertools + CloudWatch

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlertOccupancyYellow:
    Type: Number
    Default: 0.75
    Description: Occupancy ratio threshold for YELLOW alert
  AlertOccupancyRed:
    Type: Number
    Default: 0.90
    Description: Occupancy ratio threshold for RED alert
  BreachProbabilityThreshold:
    Type: Number
    Default: 0.60
    Description: P(breach) above which a probabilistic alert is raised
  ForecastHorizonWeeks:
    Type: Number
    Default: 4
    Description: Number of weeks to forecast ahead
  ForecastWorkloadTier:
    Type: String
    Default: medium
    AllowedValues: [small, medium, large]
    Description: >
      MOS-style hospital workload tier. Drives Lambda memory + timeout via the
      WorkloadTierMap mapping (Lecture 1: Cloud Resource Management).
  EnableBatching:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: Toggle batch forecasting in handler (Lecture 2 / Borg).
  EnablePriority:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: Toggle priority-based scheduling (Lecture 2 / Borg).
  EnableFallback:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
    Description: Toggle baseline fallback when SARIMA/Prophet fits fail.
  MaxFitAttempts:
    Type: Number
    Default: 2
    Description: Retry budget for the model selector before fallback.
  EnableFL:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
    Description: >
      Toggle the FL aggregation hook in the forecast Lambda's all-hospitals
      path (Lecture 4 / Federated Learning). Off by default so per-hospital
      runs don't pay the extra round-trip.
  ForecastWorkers:
    Type: Number
    Default: 4
    Description: Thread-pool size for the ParallelExecutor (Lecture 3).

# ── L1 (MOS) workload-tier → Lambda resource mappings ────────────────────────
# Tier-aware sizing lets us match memory + time budget to the hospital workload
# instead of paying for a one-size-fits-all 2 GB / 600 s Lambda.
Mappings:
  WorkloadTierMap:
    small:
      MemoryMB: 1024
      TimeoutSec: 180
      McSamples: 100
    medium:
      MemoryMB: 2048
      TimeoutSec: 360
      McSamples: 300
    large:
      MemoryMB: 3008
      TimeoutSec: 600
      McSamples: 500

Globals:
  Function:
    Runtime: python3.11
    Timeout: 300
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        SNAPSHOTS_TABLE: !Ref SnapshotsTable
        FORECASTS_TABLE: !Ref ForecastsTable
        ALERTS_TABLE:    !Ref AlertsTable
        FL_ROUNDS_TABLE: !Ref FLRoundsTable
        DATA_BUCKET:     !Ref HospitalDataBucket
        ENVIRONMENT:     !Ref Environment
        ALERT_OCCUPANCY_YELLOW:   !Ref AlertOccupancyYellow
        ALERT_OCCUPANCY_RED:      !Ref AlertOccupancyRed
        BREACH_PROB_THRESHOLD:    !Ref BreachProbabilityThreshold
        FORECAST_HORIZON_WEEKS:   !Ref ForecastHorizonWeeks
        POWERTOOLS_SERVICE_NAME:  hospital-forecasting
        LOG_LEVEL:                INFO

Resources:

  # ── S3 Buckets ──────────────────────────────────────────────────────────────
  HospitalDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hospital-forecasting-data-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hospital-forecasting-ui-${Environment}-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  # ── DynamoDB Tables (on-demand — pay-per-request, auto-scales) ─────────────
  # Key design: PK = HOSPITAL#{hospital_id}  SK = SNAPSHOT#{iso_timestamp}
  SnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hospital-snapshots-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: hospital-forecasting

  # Key design: PK = HOSPITAL#{hospital_id}  SK = FORECAST#{run_id}#{step_iso}
  ForecastsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hospital-forecasts-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: hospital-forecasting

  # Key design: PK = HOSPITAL#{hospital_id}  SK = ALERT#{iso_timestamp}
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hospital-alerts-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: hospital-forecasting

  # ── Federated Learning rounds ──────────────────────────────────────────────
  # One record per FL round for later analytics; written by the forecast
  # Lambda's FL aggregation hook (Lecture 4: Federated Learning).
  # Key design: PK = FL#GLOBAL              SK = ROUND#{round_n:06d}
  FLRoundsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hospital-forecasting-fl-rounds-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: hospital-forecasting

  # ── Dead-Letter Queues (SQS) ────────────────────────────────────────────────

  IngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hospital-ingest-dlq-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Project
          Value: HospitalForecasting

  ForecastDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hospital-forecast-dlq-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Project
          Value: HospitalForecasting

  # ── Forecast job queue ───────────────────────────────────────────────────────
  # POST /forecast enqueues here; ForecastFunction consumes and runs ML pipeline.
  # VisibilityTimeout must exceed ForecastFunction timeout (600 s).
  ForecastQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub hospital-forecast-queue-${Environment}
      VisibilityTimeout: 660
      MessageRetentionPeriod: 86400   # 24 hours — long enough to survive transient Lambda failures
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ForecastDLQ.Arn
        maxReceiveCount: 3            # 3 attempts before moving to DLQ
      Tags:
        - Key: Project
          Value: HospitalForecasting

  # ── Lambda Functions ─────────────────────────────────────────────────────────

  # Ingest: parse HHS snapshot CSV/JSON from S3 → Great Expectations validate
  #         → write to DynamoDB; failures create ingestion_failed alert
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hospital-ingest-${Environment}
      CodeUri: lambdas/ingest/
      Handler: handler.lambda_handler
      Description: >
        Parses + validates HHS occupancy snapshots via Great Expectations,
        writes clean records to DynamoDB, raises ingestion_failed alerts on error.
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref HospitalDataBucket
        - S3WritePolicy:
            BucketName: !Ref HospitalDataBucket      # for Data Docs HTML upload
        - DynamoDBWritePolicy:
            TableName: !Ref SnapshotsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AlertsTable
      Events:
        WeeklyIngest:
          Type: ScheduleV2
          Properties:
            Name: !Sub hospital-ingest-schedule-${Environment}
            Description: Pull and validate latest HHS hospital data weekly
            ScheduleExpression: "cron(0 6 ? * MON *)"
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Type: SQS
              Destination: !GetAtt IngestDLQ.Arn

  # Forecast: Docker container (heavier ML deps — Prophet, statsmodels, scikit-learn)
  #   Loads snapshot history from DynamoDB → runs BestModelSelector →
  #   writes forecasts with intervals → writes probabilistic alerts (deduped)
  #   Memory + timeout are sized via the WorkloadTierMap (L1: MOS), and
  #   retry/fallback toggles come from parameters above (L2: Borg).
  ForecastFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: python3.11-v1
      DockerContext: lambdas/forecast/
      Dockerfile: Dockerfile
    Properties:
      FunctionName: !Sub hospital-forecast-${Environment}
      PackageType: Image
      MemorySize: !FindInMap [WorkloadTierMap, !Ref ForecastWorkloadTier, MemoryMB]
      Timeout:    !FindInMap [WorkloadTierMap, !Ref ForecastWorkloadTier, TimeoutSec]
      Tags:
        WorkloadTier: !Ref ForecastWorkloadTier
        WorkloadKind: cpu_bound
        Project:      hospital-forecasting
      Description: >
        Runs ML forecasting pipeline (Baseline/SARIMA/Prophet auto-selector),
        outputs confidence intervals and probability-of-breach scores.
      Environment:
        Variables:
          SNAPSHOTS_TABLE:          !Ref SnapshotsTable
          FORECASTS_TABLE:          !Ref ForecastsTable
          ALERTS_TABLE:             !Ref AlertsTable
          DATA_BUCKET:              !Ref HospitalDataBucket
          ENVIRONMENT:              !Ref Environment
          ALERT_OCCUPANCY_YELLOW:   !Ref AlertOccupancyYellow
          ALERT_OCCUPANCY_RED:      !Ref AlertOccupancyRed
          BREACH_PROB_THRESHOLD:    !Ref BreachProbabilityThreshold
          FORECAST_HORIZON_WEEKS:   !Ref ForecastHorizonWeeks
          ENABLE_BATCHING:          !Ref EnableBatching
          ENABLE_PRIORITY:          !Ref EnablePriority
          ENABLE_FALLBACK:          !Ref EnableFallback
          ENABLE_FL:                !Ref EnableFL
          MAX_FIT_ATTEMPTS:         !Ref MaxFitAttempts
          FORECAST_WORKERS:         !Ref ForecastWorkers
          MC_SAMPLES_DEFAULT:       !FindInMap [WorkloadTierMap, !Ref ForecastWorkloadTier, McSamples]
          FL_ROUNDS_TABLE:          !Ref FLRoundsTable
          POWERTOOLS_SERVICE_NAME:  hospital-forecasting
          LOG_LEVEL:                INFO
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref HospitalDataBucket
        - S3WritePolicy:
            BucketName: !Ref HospitalDataBucket   # FL: upload per-round weight + global model JSON
        - DynamoDBReadPolicy:
            TableName: !Ref SnapshotsTable
        - DynamoDBWritePolicy:
            TableName: !Ref ForecastsTable
        - DynamoDBWritePolicy:
            TableName: !Ref AlertsTable
        - DynamoDBWritePolicy:
            TableName: !Ref FLRoundsTable
        - SQSPollerPolicy:
            QueueName: !GetAtt ForecastQueue.QueueName
      Events:
        # On-demand: triggered by POST /forecast via SQS (one message per hospital)
        ForecastQueueTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ForecastQueue.Arn
            BatchSize: 1            # one hospital per invocation — clean isolation
            MaximumConcurrency: 5   # cap parallel executions to control ML CPU cost
        # Scheduled: runs all hospitals every Monday after ingest completes
        WeeklyForecast:
          Type: ScheduleV2
          Properties:
            Name: !Sub hospital-forecast-schedule-${Environment}
            Description: Run weekly ICU occupancy forecasts after ingest completes
            ScheduleExpression: "cron(0 8 ? * MON *)"
            RetryPolicy:
              MaximumRetryAttempts: 2
            DeadLetterConfig:
              Type: SQS
              Destination: !GetAtt ForecastDLQ.Arn
        # L4 / FedAT-style staggered async cadence: Tier-2 hospitals get a
        # second weekly run on Thursday so faster-tier hospitals refresh more
        # often than slower ones without doubling the cron cost.
        Tier2RefreshForecast:
          Type: ScheduleV2
          Properties:
            Name: !Sub hospital-forecast-tier2-${Environment}
            Description: Mid-week async refresh for Tier-2 hospitals (FedAT pattern)
            ScheduleExpression: "cron(0 8 ? * THU *)"
            RetryPolicy:
              MaximumRetryAttempts: 1
            DeadLetterConfig:
              Type: SQS
              Destination: !GetAtt ForecastDLQ.Arn
            Input: |
              {"priority": true, "tier_filter": "tier_2"}

  # API: thin read layer — API Gateway HTTP API → Lambda → DynamoDB
  #      POST /forecast enqueues to ForecastQueue (async) and returns 202.
  #      Mangum adapter lets us reuse FastAPI route definitions
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hospital-api-${Environment}
      CodeUri: lambdas/api/
      Handler: handler.lambda_handler
      Description: >
        Serves /health, /snapshots, /forecasts, /alerts endpoints;
        reads DynamoDB, returns JSON to the React dashboard.
        POST /forecast enqueues to SQS and returns 202 — no ML work in API path.
      Environment:
        Variables:
          FORECAST_QUEUE_URL: !Ref ForecastQueue
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SnapshotsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ForecastsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt ForecastQueue.QueueName
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /health
            Method: GET
        LatestSnapshot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /snapshots/latest/{hospital_id}
            Method: GET
        GetForecasts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /forecasts/{hospital_id}
            Method: GET
        GetAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /alerts/{hospital_id}
            Method: GET
        TriggerForecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /forecast/{hospital_id}
            Method: POST

  # ── API Gateway HTTP API (lighter than REST API — correct for MVP) ──────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: Hospital ICU Forecast API
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 300

  # ── CloudFront Distribution (S3 static site + HTTPS + CDN) ─────────────────
  CloudFrontOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub OAI for hospital-forecasting-${Environment}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub Hospital Forecasting Dashboard (${Environment})
        Origins:
          - DomainName: !GetAtt FrontendBucket.DomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOAI}
        Enabled: true
        DefaultRootObject: index.html
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
        PriceClass: PriceClass_100

Outputs:
  ApiEndpoint:
    Description: API Gateway HTTP API endpoint (use this in frontend VITE_API_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  CloudFrontURL:
    Description: React dashboard URL (HTTPS via CloudFront)
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  FrontendBucketName:
    Description: S3 bucket — deploy React build here
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  DataBucketName:
    Description: S3 bucket for raw HHS data + model artifacts
    Value: !Ref HospitalDataBucket
    Export:
      Name: !Sub ${AWS::StackName}-DataBucket

  SnapshotsTableName:
    Value: !Ref SnapshotsTable
  ForecastsTableName:
    Value: !Ref ForecastsTable
  AlertsTableName:
    Value: !Ref AlertsTable
  FLRoundsTableName:
    Value: !Ref FLRoundsTable

  IngestFunctionArn:
    Value: !GetAtt IngestFunction.Arn
  ForecastFunctionArn:
    Value: !GetAtt ForecastFunction.Arn
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn

  IngestDLQUrl:
    Value: !Ref IngestDLQ
  ForecastDLQUrl:
    Value: !Ref ForecastDLQ
  ForecastQueueUrl:
    Description: SQS queue URL for on-demand forecast jobs (POST /forecast enqueues here)
    Value: !Ref ForecastQueue
